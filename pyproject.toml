[project]
name = "koq-player"
version = "0.1.0"
description = ""
authors = [{ name = "Shohei Okubo", email = "okubo@koq.jp" }]
requires-python = ">=3.13, <4"
readme = "README.md"
license = "MIT"
dependencies = [
    "discord.py>=2.3.0",
    "dynaconf",
    "pathlib",
    "pynacl>=1.6.2",
    "yt-dlp",
]

[project.optional-dependencies]
voice = [
    "discord.py>=2.6.4",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
asyncio_mode = "auto"
